name: dart_ts_generator
description: >
  A build_runner code generator that converts Dart models and enums into
  TypeScript + Zod schemas. Supports enums, nullable types, defaults,
  nested models, inheritance, DateTime converters, and cross-file imports.

version: 2.0.4
repository: https://github.com/your-org/dart_ts_generator

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # Core build system
  build: ^4.0.5

  # Dart static analysis – used to read class/enum/field metadata
  analyzer: ^10.0.1

  # Source gen utilities (LibraryReader, TypeChecker, etc.)
  source_gen: ^4.2.2

  # File-system glob patterns (findAssets)
  glob: ^2.1.3

  # Path manipulation for relative import computation
  path: ^1.9.1

  cloud_firestore: ^6.0.3
  json_annotation: ^4.9.0

dev_dependencies:
  # Run code generation
  build_runner: ^2.13.1

  # Testing builders
  build_test: ^3.5.12

  # Dart lints
  lints: ^6.1.0

  test: ^1.30.0

  json_serializable: ^6.11.1
