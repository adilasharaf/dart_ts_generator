builders:
  # ── Utils builder ─────────────────────────────────────────────────────────
  # Generates the shared Zod transforms for dates, phones, etc.
  ts_utils_builder:
    import: "package:dart_ts_generator/utils_builder.dart"
    builder_factories: ["tsUtilsBuilder"]
    build_extensions: { "$package$": ["gen/utils/converters.g.ts"] }
    auto_apply: root_package
    build_to: source

  # ── Per-file builder ──────────────────────────────────────────────────────
  # Converts each lib/**/*.dart → gen/**/*.g.ts (root-level gen/, not lib/gen/)
  dart_ts_file_builder:
    import: "package:dart_ts_generator/builder.dart"
    builder_factories: ["dartTsFileBuilder"]
    build_extensions: { "^lib/{{}}.dart": ["gen/{{}}.g.ts"] }
    auto_apply: root_package
    build_to: source
    runs_before:
      - "dart_ts_generator|ts_index_builder"

  # ── Barrel / index builder ────────────────────────────────────────────────
  # Collects all gen/**/*.g.ts and emits gen/eimodels.g.ts barrel.
  #
  # Uses $package$ (not $lib$) because the output lives outside lib/.
  # required_inputs ensures this runs in a later phase than dart_ts_file_builder
  # so findAssets('gen/**.g.ts') actually finds the generated files.
  ts_index_builder:
    import: "package:dart_ts_generator/index_builder.dart"
    builder_factories: ["tsIndexBuilder"]
    build_extensions: { "$package$": ["gen/eimodels.g.ts"] }
    auto_apply: root_package
    build_to: source
    required_inputs:
      - "gen/**.g.ts"
